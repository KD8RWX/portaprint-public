<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PortaPrint</title>
    <!-- Prevent Caching -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/keyboard.css">
    <script src="js/keyboard.js"></script>
    <script src="js/qrcode.min.js"></script>
</head>

<body>
    <div id="app" class="container">

        <!-- View: Initializing / Loading -->
        <div id="view-loading" class="view active">
            <div class="loader-ring"></div>
            <p class="status-text label">SYSTEM INITIALIZING...</p>
        </div>

        <!-- View: WiFi Wizard -->
        <div id="view-wifi" class="view">
            <div class="glass-panel">
                <h1>Network Setup</h1>
                <p class="subtitle">Connect to a secure network to proceed.</p>

                <!-- List Container -->
                <div id="wifi-list-container" style="width: 100%; max-height: 180px; overflow-y: auto;">
                    <div id="wifi-list">
                        <div class="wifi-scanning">
                            <div class="loader-ring" style="width: 32px; height: 32px; border-width: 3px;"></div>
                            <span style="display:block; margin-top:10px; opacity:0.6">Scanning...</span>
                        </div>
                    </div>
                </div>

                <!-- Form Container -->
                <div id="wifi-form-container" class="hidden" style="width: 100%;">
                    <h2 id="selected-ssid" style="margin-bottom: 1rem; font-size: 1.5rem;">Network Name</h2>
                    <input type="password" id="wifi-password" placeholder="Enter Password" class="input-field" />
                </div>
            </div>

            <!-- Navigation Controls (Bottom Edges) -->
            <button id="btn-wifi-back" class="screen-btn left">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                <span>Back</span>
            </button>
            <button id="btn-wifi-connect" class="screen-btn right hidden">
                <span>Connect</span>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12l5 5L20 7" />
                </svg>
            </button>
        </div>

        <!-- View: Ready (Access Point Info) -->
        <div id="view-ready" class="view">
            <div class="glass-panel" style="width: 100%; max-width: 700px; padding: 2rem;">
                <div class="ready-content">
                    <div class="ready-content">
                        <div class="ready-info">
                            <!-- IP Display -->
                            <div class="always-visible">
                                <div class="label">Device IP</div>
                                <div id="device-ip" class="ip-display">---.---.---.---</div>
                            </div>

                            <!-- Status Indicator -->
                            <div class="status-indicator" style="margin-top: 1.5rem;">
                                <div class="dot pulse"></div>
                                <span id="connection-status"
                                    style="color: var(--accent-color); font-weight: 600;">Waiting for Client</span>
                            </div>
                        </div>

                        <!-- QR Code -->
                        <div class="qr-container always-visible" id="qrcode">
                            <!-- QR Code Generated Here -->
                        </div>
                    </div>
                    <p class="label" style="text-align: center; margin-top: 1rem; color: var(--text-secondary);">
                        SCAN TO PAIR</p>
                </div>
            </div>

            <!-- Wifi Setup Button -->
            <button id="btn-open-wifi" class="floating-btn-bottom-left" title="WiFi Setup">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
                    <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                    <line x1="12" y1="20" x2="12.01" y2="20"></line>
                </svg>
                <span style="margin-left: 8px;">Network Setup</span>
            </button>
        </div>

        <!-- View: Active / Scanning -->
        <div id="view-scanning" class="view">
            <div class="glass-panel">
                <div class="scan-visualizer">
                    <img id="hand-image" src="assets/hand/hand-left.png" alt="Hand Guide" class="hand-image">
                    <div class="scan-overlay"></div>
                    <p id="debug-src"
                        style="color:red; font-size:12px; position:absolute; bottom:5px; background: rgba(0,0,0,0.7); padding: 2px;">
                        DEBUG: SRC</p>
                </div>
                <h1>Scanning</h1>
                <p id="scan-instruction" class="subtitle">Please place finger on the scanner</p>
            </div>
        </div>

        <!-- View: Keyboard Overlay -->
        <div id="view-keyboard" class="view" style="z-index: 9999; background: rgba(0,0,0,0.95);">
            <div class="keyboard-container"
                style="width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 2rem; max-width: 800px; margin: 0 auto;">
                <h2 style="color:white; margin-bottom: 1rem; text-align: center;">Enter Password</h2>
                <div style="margin-bottom: 2rem;">
                    <input type="password" id="keyboard-input" class="input-field" placeholder=""
                        style="font-size: 2rem; padding: 1.5rem; text-align: center;" readonly>
                </div>
                <div class="simple-keyboard" style="color: black;"></div>

                <button id="btn-keyboard-close" class="screen-btn right">
                    <span>Done</span>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12l5 5L20 7" />
                    </svg>
                </button>

                <button id="btn-keyboard-cancel" class="screen-btn left">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6L6 18M6 6l12 12" />
                    </svg>
                    <span>Cancel</span>
                </button>
            </div>
        </div>

    </div>

    <script src="js/app.js"></script>
</body>

</html>
